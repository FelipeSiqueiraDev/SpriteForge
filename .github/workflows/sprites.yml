name: SpriteForge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar ferramenta
        run: python -m pip install .
      - name: Testar contrato e exportações
        run: python -m unittest discover -s tests -v
      - name: Exportar demonstração e personagens cadastrados
        shell: bash
        run: |
          spriteforge demo --output demo-input
          spriteforge build demo-input/training-dummy/manifest.json --output dist
          python - <<'PY'
          import subprocess
          import json
          from pathlib import Path
          ids = {'training-dummy'}
          appearances = []
          recipes = sorted(Path('templates/humanoid').glob('*.json'), key=lambda p: (p.stem != 'chibi-base', p.name))
          for recipe in recipes:
              character_id = json.loads(recipe.read_text(encoding='utf-8'))['id']
              if character_id in ids:
                  raise ValueError(f'ID duplicado: {character_id}')
              ids.add(character_id)
              subprocess.run(['spriteforge', 'rig', str(recipe), '--output', 'demo-input', '--workers', '2'], check=True)
              subprocess.run(['spriteforge', 'build', f'demo-input/{character_id}/manifest.json', '--output', 'dist'], check=True)
              subprocess.run(['spriteforge', 'crona', f'demo-input/{character_id}/manifest.json', '--output', 'dist/crona'], check=True)
              appearances.append(f'dist/{character_id}')
          subprocess.run(['spriteforge', 'wardrobe', *appearances, '--output', 'dist/wardrobe.html'], check=True)
          for manifest in sorted(Path('characters').rglob('manifest.json')):
              character_id = json.loads(manifest.read_text(encoding='utf-8'))['id']
              if character_id in ids:
                  raise ValueError(f'ID duplicado: {character_id}')
              ids.add(character_id)
              subprocess.run(['spriteforge', 'build', str(manifest), '--output', 'dist'], check=True)
          PY
          python scripts/render_rig_previews.py --output dist/previews
          python scripts/render_crona_preview.py --output dist/previews
          python scripts/render_chibi_previews.py --output dist/previews
          python scripts/audit_chibi_exports.py
          python scripts/assemble_reference_walk.py art-direction/chibi-reference-walk/walk-sheet.png dist/previews/reference-walk
          cp -r art-direction dist/art-direction
          cp delivery/LEIA-ME.txt dist/LEIA-ME.txt
          mkdir -p build
          git show 178baeee662d07bb6bf2cd9bc483b0876d8786be:src/spriteforge/rig.py > build/rig-v1.py
          git show 178baeee662d07bb6bf2cd9bc483b0876d8786be:templates/humanoid/base.json > build/base-v1.json
          python scripts/render_body_review.py --baseline-source build/rig-v1.py --baseline-recipe build/base-v1.json --output dist/previews/humanoid-before-after.png
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar teste da prévia
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Testar prévia no navegador
        run: node tests/preview.cjs
      - name: Montar e conferir animação 2D da referência
        run: |
          node scripts/build_reference_puppet.cjs art-direction/chibi-reference-puppet/parts.png dist/previews/reference-puppet
          python scripts/encode_reference_puppet.py dist/previews/reference-puppet
      - name: Guardar pacote de prévias e sprites
        uses: actions/upload-artifact@v4
        with:
          name: spriteforge-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
