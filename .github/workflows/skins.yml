name: CRONA Skins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-skins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ler catálogo e renderizadores do CRONA
        uses: actions/checkout@v4
        with:
          repository: FelipeSiqueiraDev/CRONA
          ref: main
          path: upstream/crona
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /shared/src/furni.ts
            /client/public/arte/mobiliario/moveis.json
            /client/public/arte/texturas/texturas.json
            /scripts/3d/codigo/motor.py
            /scripts/3d/estilo/exportar_px.py
            /scripts/3d/estilo/texturas_px.py
            /scripts/3d/estilo/agente_cozinha/base_estilo.py
            /scripts/3d/estilo/agente_cozinha/cozinha.py
            /scripts/3d/estilo/agente_cozinha/janela_cozinha.py
            /scripts/3d/estilo/agente_cozinha/fogo_cozinha.py
            /scripts/3d/estilo/agente_cozinha/fogo_px.py
            /scripts/3d/estilo/agente_cozinha/noite.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar e conferir o contrato de skins
        run: |
          python -m pip install .
          python -m unittest discover -s tests -p test_skins.py -v
          node --test tests/catalog.cjs
      - name: Atualizar catálogo e produzir o lote disponível
        run: |
          node scripts/import_crona_catalog.cjs upstream/crona/shared/src/furni.ts build/catalog.json
          spriteforge skins --source upstream/crona --catalog build/catalog.json
          python scripts/render_skin_preview.py --output dist/skins/crona-cozy-v1/previews/moveis.png
          git -C upstream/crona rev-parse HEAD > dist/skins/crona-cozy-v1/crona-checkout.txt
      - name: Preparar teste da galeria
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Conferir imagens, giros, estados e fila no navegador
        run: node tests/skins-preview.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: crona-skins-${{ github.sha }}
          path: dist/skins/
          if-no-files-found: error
          retention-days: 30
